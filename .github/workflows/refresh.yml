name: Refresh contract classifieds

# Run on demand (Actions tab → "Refresh contract classifieds" → Run workflow — also works
# from the GitHub mobile app) and automatically every 6 hours.
on:
  workflow_dispatch:
    inputs:
      include_full_time:
        description: "Also include full-time roles"
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: classifieds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore seen-listings state (for NEW badges)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Fetch and rank listings
        shell: bash
        run: |
          mkdir -p site
          python -m classifieds --out site --limit 50 \
            ${{ inputs.include_full_time && '--include-full-time' || '' }} 2>&1 | tee site/summary.txt
          { echo '```'; cat site/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save seen-listings state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: seen-${{ github.run_id }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: contract-classifieds
          path: site

      - name: Package for GitHub Pages
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
