name: Refresh contract classifieds

# Runs every 6 hours, whenever the app or config changes on main, and on demand
# (Actions tab → "Refresh contract classifieds" → Run workflow — also works from the GitHub mobile app).
on:
  workflow_dispatch:
    inputs:
      include_full_time:
        description: "Also include full-time roles"
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "classifieds/**"
      - "config.json"
      - ".github/workflows/refresh.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: classifieds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore seen-listings state (for NEW badges)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Fetch and rank listings
        shell: bash
        run: |
          mkdir -p site
          python -m classifieds --out site --limit 50 \
            ${{ inputs.include_full_time && '--include-full-time' || '' }} 2>&1 | tee site/summary.txt
          { echo '```'; cat site/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Add the web app
        run: |
          mv site/index.html site/report.html
          cp web/index.html site/index.html

      - name: Save seen-listings state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: seen-${{ github.run_id }}

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: contract-classifieds
          path: site

      # Publishes to GitHub Pages only when Pages is enabled with "GitHub Actions" as the source
      # (Settings → Pages). Otherwise this step is skipped and the run still succeeds.
      - name: Check GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Package for GitHub Pages
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
